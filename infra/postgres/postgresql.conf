# Dev Postgres tuning (B-09). Mounted into the container; requires restart after change.
# Note: shared_preload_libraries only applies on first start of a data volume —
# if postgres was already initialized, recreate: docker compose down -v && docker compose up -d postgres

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
